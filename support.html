<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJS Shuir - Tech Support</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
    }
    .nav-gold {
      color: #d4af37;
    }
    .nav-gold:hover {
      color: #f0c14b;
    }
    .btn-gold {
      background-color: #d4af37;
      color: #1a1a1a;
      transition: transform 0.2s;
    }
    .btn-gold:hover {
      background-color: #f0c14b;
      transform: scale(1.05);
    }
    .form-container {
      max-width: 600px;
      background-color: #2a2a2a;
      padding: 2rem;
      border-radius: 0.5rem;
      border: 1px solid #d4af37;
    }
  </style>
</head>
<body>
  <nav class="bg-black p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl text-white">RJS Shuir</h1>
      <div>
        <a href="index.html" class="nav-gold mr-4">Home</a>
        <a href="recordings.html" class="nav-gold mr-4">Recordings</a>
        <a href="support.html" class="nav-gold">Tech Support</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4">
    <div class="form-container mx-auto">
      <h2 class="text-2xl font-semibold text-white mb-4 text-center">Tech Support</h2>
      <form id="support-form">
        <label for="name" class="block text-gray-300 mb-2">Name</label>
        <input type="text" id="name" name="name" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="email" class="block text-gray-300 mb-2">Email</label>
        <input type="email" id="email" name="email" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="problem" class="block text-gray-300 mb-2">Describe Your Issue</label>
        <textarea id="problem" name="problem" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" rows="5" required></textarea>
        <button type="submit" class="btn-gold w-full py-2 rounded">Send Request</button>
      </form>
      <p id="support-message" class="mt-4 text-center"></p>
    </div>
  </div>
  <script>
    document.getElementById('support-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      const message = document.getElementById('support-message');
      try {
        const response = await fetch('/send-support', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const result = await response.json();
        message.textContent = result.message;
        message.classList.add('text-green-400');
        e.target.reset();
      } catch (error) {
        message.textContent = 'Error sending request.';
        message.classList.add('text-red-400');
      }
    });
  </script>
</body>
</html>
