<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJS Shuir - Recordings</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
    }
    .nav-gold {
      color: #d4af37;
    }
    .nav-gold:hover {
      color: #f0c14b;
    }
    .btn-gold {
      background-color: #d4af37;
      color: #1a1a1a;
      transition: transform 0.2s;
    }
    .btn-gold:hover {
      background-color: #f0c14b;
      transform: scale(1.05);
    }
    .recording-card {
      background-color: #2a2a2a;
      border: 1px solid #d4af37;
      border-radius: 0.5rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <nav class="bg-black p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl text-white">RJS Shuir</h1>
      <div>
        <a href="index.html" class="nav-gold mr-4">Home</a>
        <a href="recordings.html" class="nav-gold mr-4">Recordings</a>
        <a href="support.html" class="nav-gold">Tech Support</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4">
    <h2 class="text-2xl font-semibold text-white mb-4 text-center">Recordings</h2>
    <div class="form-container max-w-md mx-auto mb-6">
      <label for="search" class="block text-gray-300 mb-2">Search Recordings</label>
      <input type="text" id="search" placeholder="Enter date, type, or number/name" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" />
      <button onclick="searchRecordings()" class="btn-gold w-full py-2 rounded">Search</button>
    </div>
    <div id="recordings-list" class="grid gap-4"></div>
  </div>
  <script>
    async function searchRecordings() {
      const query = document.getElementById('search').value;
      const list = document.getElementById('recordings-list');
      list.innerHTML = '<p class="text-gray-300 text-center">Searching...</p>';
      try {
        const response = await fetch(`/search?query=${encodeURIComponent(query)}`);
        const recordings = await response.json();
        list.innerHTML = '';
        if (recordings.length === 0) {
          list.innerHTML = '<p class="text-gray-300 text-center">No recordings found.</p>';
          return;
        }
        recordings.forEach((rec) => {
          const card = document.createElement('div');
          card.className = 'recording-card';
          card.innerHTML = `
            <p class="text-white">Date: ${rec.date}</p>
            <p class="text-white">Type: ${rec.type}</p>
            <p class="text-white">${rec.type === 'Shiur' ? 'Shiur Number' : 'Mussar Name'}: ${rec.type === 'Shiur' ? rec.shiurNumber : rec.mussarName}</p>
            <audio controls class="w-full my-2">
              <source src="${rec.fileUrl}" type="audio/mpeg">
              Your browser does not support the audio element.
            </audio>
            <a href="${rec.fileUrl}" download class="btn-gold px-4 py-2 rounded inline-block">Download</a>
          `;
          list.appendChild(card);
        });
      } catch (error) {
        list.innerHTML = '<p class="text-red-400 text-center">Error searching recordings.</p>';
      }
    }
  </script>
</body>
</html>
