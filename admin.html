<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJS Shuir - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a1a;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
    }
    .nav-gold {
      color: #d4af37;
    }
    .nav-gold:hover {
      color: #f0c14b;
    }
    .btn-gold {
      background-color: #d4af37;
      color: #1a1a1a;
      transition: transform 0.2s;
    }
    .btn-gold:hover {
      background-color: #f0c14b;
      transform: scale(1.05);
    }
    .form-container {
      max-width: 600px;
      background-color: #2a2a2a;
      padding: 2rem;
      border-radius: 0.5rem;
      border: 1px solid #d4af37;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #444;
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      background-color: #d4af37;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <nav class="bg-black p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl text-white">RJS Shuir</h1>
      <div>
        <a href="index.html" class="nav-gold mr-4">Home</a>
        <a href="recordings.html" class="nav-gold mr-4">Recordings</a>
        <a href="support.html" class="nav-gold">Tech Support</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4">
    <div class="form-container mx-auto">
      <h2 class="text-2xl font-semibold text-white mb-4 text-center">Admin - Upload Recording</h2>
      <div id="password-section">
        <label for="admin-password" class="block text-gray-300 mb-2">Enter Admin Password</label>
        <input type="password" id="admin-password" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" />
        <button onclick="checkPassword()" class="btn-gold w-full py-2 rounded">Unlock</button>
      </div>
      <form id="upload-form" class="hidden">
        <label for="file" class="block text-gray-300 mb-2">Select Recording (MP3, max 2 hours)</label>
        <input type="file" id="file" name="file" accept=".mp3" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="date" class="block text-gray-300 mb-2">Date</label>
        <input type="date" id="date" name="date" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="type" class="block text-gray-300 mb-2">Type</label>
        <select id="type" name="type" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required onchange="toggleFields()">
          <option value="Shiur">Shiur</option>
          <option value="Mussar">Mussar</option>
        </select>
        <div id="shiur-field">
          <label for="shiur-number" class="block text-gray-300 mb-2">Shiur Number</label>
          <input type="text" id="shiur-number" name="shiur-number" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" placeholder="e.g., Shiur 42" />
        </div>
        <div id="mussar-field" class="hidden">
          <label for="mussar-name" class="block text-gray-300 mb-2">Mussar Name</label>
          <input type="text" id="mussar-name" name="mussar-name" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" placeholder="e.g., Reb Cohen" />
        </div>
        <div id="progress-container" class="hidden mb-4">
          <p class="text-gray-300 mb-2">Upload Progress:</p>
          <div class="progress-bar">
            <div id="progress" class="progress"></div>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn-gold w-full py-2 rounded">Upload Recording</button>
      </form>
      <p id="upload-message" class="mt-4 text-center"></p>
    </div>
    <div class="mt-4 text-center">
      <a href="#" onclick="runHealthCheck(); return false;" class="nav-gold">Check API Status</a>
      <div id="health-status" class="mt-2 text-xs"></div>
    </div>
  </div>
  <script>
    function checkPassword() {
      const password = document.getElementById('admin-password').value;
      if (password === 'rjsadmin2025') {
        document.getElementById('password-section').classList.add('hidden');
        document.getElementById('upload-form').classList.remove('hidden');
      } else {
        alert('Incorrect password');
      }
    }

    function toggleFields() {
      const type = document.getElementById('type').value;
      document.getElementById('shiur-field').classList.toggle('hidden', type !== 'Shiur');
      document.getElementById('mussar-field').classList.toggle('hidden', type !== 'Mussar');
    }

    // Health check function to help debug API issues
    async function runHealthCheck() {
      const healthStatus = document.getElementById('health-status');
      healthStatus.textContent = 'Checking API health...';
      try {
        const response = await fetch('/api/health');
        if (response.ok) {
          const data = await response.json();
          healthStatus.innerHTML = `
            <span class="text-green-400">✓ API is healthy</span><br>
            Time: ${data.timestamp}<br>
            Environment: ${data.env}<br>
            Blob Enabled: ${data.blobEnabled}
          `;
        } else {
          healthStatus.innerHTML = `<span class="text-red-400">✗ API Error: ${response.status} ${response.statusText}</span>`;
        }
      } catch (error) {
        healthStatus.innerHTML = `<span class="text-red-400">✗ API Connection Error: ${error.message}</span>`;
      }
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const message = document.getElementById('upload-message');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress');
      const submitBtn = document.getElementById('submit-btn');
      
      message.textContent = 'Starting upload...';
      message.className = 'mt-4 text-center text-white';
      progressContainer.classList.remove('hidden');
      submitBtn.disabled = true;
      
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];
      const date = document.getElementById('date').value;
      const type = document.getElementById('type').value;
      const shiurNumber = document.getElementById('shiur-number').value;
      const mussarName = document.getElementById('mussar-name').value;

      if (!file || !date || !type) {
        message.textContent = 'Missing required fields.';
        message.className = 'mt-4 text-center text-red-400';
        submitBtn.disabled = false;
        progressContainer.classList.add('hidden');
        return;
      }

      try {
        // Log the file details to debug
        message.textContent = `Preparing file: ${file.name} (${Math.round(file.size/1024)} KB)`;
        progressBar.style.width = '5%';

        // Step 1: Get upload URL from server - make sure to use POST method
        message.textContent = 'Requesting upload URL...';
        progressBar.style.width = '10%';
        
        const response = await fetch('/generate-upload-url', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ filename: file.name }),
        });
        
        if (!response.ok) {
          const errorText = await response.text();
          throw new Error(`Server error: ${response.status} - ${response.statusText} - ${errorText}`);
        }
        
        const data = await response.json();
        console.log('Upload URL response:', data);
        const uploadUrl = data.uploadUrl;
        
        if (!uploadUrl) {
          throw new Error('Failed to get upload URL.');
        }

        // Step 2: Upload file to Vercel Blob
        message.textContent = 'Uploading file to Vercel Blob...';
        progressBar.style.width = '30%';
        
        // Create XMLHttpRequest for progress monitoring
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', uploadUrl, true);
        xhr.setRequestHeader('Content-Type', file.type || 'audio/mpeg');
        
        xhr.upload.onprogress = function(event) {
          if (event.lengthComputable) {
            const percentComplete = Math.min(90, 30 + (event.loaded / event.total * 60));
            progressBar.style.width = percentComplete + '%';
            message.textContent = `Uploading: ${Math.round(percentComplete)}%`;
          }
        };
        
        const uploadPromise = new Promise((resolve, reject) => {
          xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) {
              // Try to get the Vercel Blob URL from response headers
              const fileUrl = xhr.getResponseHeader('x-vercel-blob-url') || data.downloadUrl || uploadUrl.split('?')[0];
              resolve(fileUrl);
            } else {
              reject(new Error(`Upload error: ${xhr.status} - ${xhr.statusText}`));
            }
          };
          xhr.onerror = function() {
            reject(new Error('Network error during upload'));
          };
        });
        
        xhr.send(file);
        const fileUrl = await uploadPromise;
        console.log('File uploaded to:', fileUrl);

        // Step 3: Store metadata in MongoDB
        message.textContent = 'Storing recording metadata...';
        progressBar.style.width = '95%';
        
        const metadataResponse = await fetch('/store-recording', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date,
            type,
            'shiur-number': type === 'Shiur' ? shiurNumber : undefined,
            'mussar-name': type === 'Mussar' ? mussarName : undefined,
            fileUrl,
          }),
        });
        
        if (!metadataResponse.ok) {
          const errorText = await metadataResponse.text();
          throw new Error(`Metadata error: ${metadataResponse.status} - ${metadataResponse.statusText} - ${errorText}`);
        }
        
        const result = await metadataResponse.json();
        message.textContent = result.message;
        message.className = 'mt-4 text-center text-green-400';
        progressBar.style.width = '100%';
        e.target.reset();
        
        // Hide progress bar after a delay
        setTimeout(() => {
          progressContainer.classList.add('hidden');
          submitBtn.disabled = false;
        }, 2000);
        
      } catch (error) {
        console.error('Upload error:', error);
        message.textContent = 'Error uploading recording: ' + error.message;
        message.className = 'mt-4 text-center text-red-400';
        progressContainer.classList.add('hidden');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
