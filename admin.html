<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJS Shuir - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@vercel/blob@0.27.0/dist/index.js"></script>
  <style>
    body {
      background-color: #1a1a1a;
      color: #e5e5e5;
      font-family: 'Inter', sans-serif;
    }
    .nav-gold {
      color: #d4af37;
    }
    .nav-gold:hover {
      color: #f0c14b;
    }
    .btn-gold {
      background-color: #d4af37;
      color: #1a1a1a;
      transition: transform 0.2s;
    }
    .btn-gold:hover {
      background-color: #f0c14b;
      transform: scale(1.05);
    }
    .form-container {
      max-width: 600px;
      background-color: #2a2a2a;
      padding: 2rem;
      border-radius: 0.5rem;
      border: 1px solid #d4af37;
    }
  </style>
</head>
<body>
  <nav class="bg-black p-4">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl text-white">RJS Shuir</h1>
      <div>
        <a href="index.html" class="nav-gold mr-4">Home</a>
        <a href="recordings.html" class="nav-gold mr-4">Recordings</a>
        <a href="support.html" class="nav-gold">Tech Support</a>
      </div>
    </div>
  </nav>
  <div class="container mx-auto p-4">
    <div class="form-container mx-auto">
      <h2 class="text-2xl font-semibold text-white mb-4 text-center">Admin - Upload Recording</h2>
      <div id="password-section">
        <label for="admin-password" class="block text-gray-300 mb-2">Enter Admin Password</label>
        <input type="password" id="admin-password" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" />
        <button onclick="checkPassword()" class="btn-gold w-full py-2 rounded">Unlock</button>
      </div>
      <form id="upload-form" class="hidden">
        <label for="file" class="block text-gray-300 mb-2">Select Recording (MP3, max 2 hours, 200MB)</label>
        <input type="file" id="file" name="file" accept=".mp3" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="date" class="block text-gray-300 mb-2">Date</label>
        <input type="date" id="date" name="date" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required />
        <label for="type" class="block text-gray-300 mb-2">Type</label>
        <select id="type" name="type" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" required onchange="toggleFields()">
          <option value="Shiur">Shiur</option>
          <option value="Mussar">Mussar</option>
        </select>
        <div id="shiur-field">
          <label for="shiur-number" class="block text-gray-300 mb-2">Shiur Number</label>
          <input type="text" id="shiur-number" name="shiur-number" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" placeholder="e.g., Shiur 42" />
        </div>
        <div id="mussar-field" class="hidden">
          <label for="mussar-name" class="block text-gray-300 mb-2">Mussar Name</label>
          <input type="text" id="mussar-name" name="mussar-name" class="w-full p-2 rounded bg-gray-800 text-white border border-gray-600 mb-4" placeholder="e.g., Reb Cohen" />
        </div>
        <button type="submit" class="btn-gold w-full py-2 rounded">Upload Recording</button>
      </form>
      <p id="upload-message" class="mt-4 text-center"></p>
    </div>
  </div>
  <script>
    function checkPassword() {
      const password = document.getElementById('admin-password').value;
      if (password === 'rjsadmin2025') {
        document.getElementById('password-section').classList.add('hidden');
        document.getElementById('upload-form').classList.remove('hidden');
      } else {
        alert('Incorrect password');
      }
    }

    function toggleFields() {
      const type = document.getElementById('type').value;
      document.getElementById('shiur-field').classList.toggle('hidden', type !== 'Shiur');
      document.getElementById('mussar-field').classList.toggle('hidden', type !== 'Mussar');
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = document.getElementById('upload-message');
      const fileInput = document.getElementById('file');
      const file = fileInput.files[0];
      const date = document.getElementById('date').value;
      const type = document.getElementById('type').value;
      const shiurNumber = document.getElementById('shiur-number').value;
      const mussarName = document.getElementById('mussar-name').value;

      // Client-side file size validation
      const maxSize = 200 * 1024 * 1024; // 200MB in bytes
      if (!file || file.size > maxSize) {
        message.textContent = 'File too large or missing. Maximum size is 200MB.';
        message.classList.add('text-red-400');
        return;
      }
      if (!date || !type) {
        message.textContent = 'Missing required fields.';
        message.classList.add('text-red-400');
        return;
      }

      // Check if Vercel Blob library is loaded
      if (typeof window.VercelBlob === 'undefined') {
        message.textContent = 'Error: Vercel Blob library failed to load.';
        message.classList.add('text-red-400');
        return;
      }

      try {
        // Step 1: Get upload token from server
        const tokenResponse = await fetch('/generate-upload-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name }),
        });
        const tokenResult = await tokenResponse.json();
        if (!tokenResponse.ok) {
          throw new Error(tokenResult.message || 'Failed to get upload token.');
        }
        const { pathname, token } = tokenResult;

        // Step 2: Upload file to Vercel Blob client-side
        const { upload } = window.VercelBlob;
        const { url } = await upload(pathname, file, {
          access: 'public',
          token,
        });

        // Step 3: Store metadata in MongoDB
        const metadataResponse = await fetch('/store-recording', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date,
            type,
            'shiur-number': type === 'Shiur' ? shiurNumber : undefined,
            'mussar-name': type === 'Mussar' ? mussarName : undefined,
            fileUrl: url,
          }),
        });
        const metadataResult = await metadataResponse.json();
        if (!metadataResponse.ok) {
          throw new Error(metadataResult.message || 'Failed to store metadata.');
        }

        message.textContent = metadataResult.message;
        message.classList.add('text-green-400');
        e.target.reset();
      } catch (error) {
        message.textContent = 'Error uploading recording: ' + error.message;
        message.classList.add('text-red-400');
      }
    });
  </script>

</html>
